<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결과물 라벨링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --paper: #e6eae5;
  --sheet: #f6f7f3;
  --ink: #17201b;
  --muted: #59645d;
  --rule: #c5ccc5;
  --sage: #8c988f;
  --pencil: #d8701c;
  --match: #23704a;
  --hidden: #566a85;
  --diff: #c4301d;
  --unver: #9b6a0c;
  --radius-s: 4px;
  --radius-m: 10px;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; color: var(--ink);
  font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px 64px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 0 10px; border-bottom: 2px solid var(--ink); }
header.top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
select { padding: 6px 10px; background: var(--sheet); border: 1px solid var(--ink); border-radius: var(--radius-s); }
.prog { color: var(--muted); font-size: 15px; }
.prog b { color: var(--ink); }
details.about { margin: 8px 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 4px 16px; }
details.about summary { cursor: pointer; font-weight: 600; }
details.about p { margin: 8px 0 4px; color: var(--muted); font-size: 14.5px; }
.stage { display: grid; grid-template-columns: 220px 1fr; gap: 20px; margin-top: 8px; }
.refs { display: flex; flex-direction: column; gap: 8px; align-content: start; }
.refs h2, .shot h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
.refs .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.refs img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius-s); cursor: zoom-in; }
.shot { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 10px 16px; }
.shot .frame { display: grid; place-items: center; }
.shot img { max-width: 100%; max-height: max(220px, calc(100vh - 430px)); object-fit: contain; }
.shot .meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 14px; color: var(--muted); }
.bar { margin-top: 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 10px 16px; }
.btns, .chips { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { padding: 6px 22px; border: 2px solid var(--ink); border-radius: var(--radius-s); background: var(--sheet); font-weight: 600; cursor: pointer; }
.btn.match { border-color: var(--match); color: var(--match); }
.btn.not_visible { border-color: var(--hidden); color: var(--hidden); }
.btn.different { border-color: var(--diff); color: var(--diff); }
.btn.on.match { background: var(--match); color: var(--sheet); }
.btn.on.not_visible { background: var(--hidden); color: var(--sheet); }
.btn.on.different { background: var(--diff); color: var(--sheet); }
.chips { margin-top: 8px; align-items: center; }
.chip { padding: 6px 14px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--sheet); cursor: pointer; font-size: 15px; }
.chip.on { background: var(--ink); color: var(--sheet); }
.chips .savebtn { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
.tool { margin-top: 6px; font-size: 13px; color: var(--muted); min-height: 22px; }
.nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 6px; font-size: 14px; color: var(--muted); }
.nav button { padding: 4px 12px; border: 1px solid var(--rule); border-radius: var(--radius-s); background: var(--sheet); cursor: pointer; }
.err { color: var(--diff); }
.hint { color: var(--muted); font-size: 13px; }
dialog { border: 0; padding: 0; background: transparent; max-width: 92vw; }
dialog::backdrop { background: rgba(23, 32, 27, .7); }
dialog img { max-width: 92vw; max-height: 92vh; display: block; border-radius: var(--radius-m); }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>결과물 라벨링</h1>
    <select id="case" aria-label="케이스"></select>
    <span class="prog" id="prog"></span>
    <span class="prog" id="total"></span>
  </header>
  <details class="about"><summary>라벨 뜻</summary><p id="about"></p></details>
  <div class="stage">
    <div class="refs"><h2>실물 사진 (누르면 크게)</h2><div class="thumbs" id="refs"></div></div>
    <div class="shot">
      <h2>결과물</h2>
      <div class="frame"><img id="img" alt="결과물"></div>
      <div class="meta"><span id="fname"></span><span id="state"></span></div>
    </div>
  </div>
  <div class="bar">
    <div class="btns" id="btns"></div>
    <div class="chips" id="chips" hidden><span id="chipList" class="chips"></span><button class="btn savebtn" id="save">저장(Enter)</button></div>
    <div class="tool" id="tool"></div>
    <div class="nav"><button id="prev">이전(←)</button><button id="next">다음(→)</button><span id="pos"></span><span class="hint">1 일치, 2 안 보임, 3 다름. 다름: Q W E R T 이유, Enter 저장.</span></div>
  </div>
</div>
<dialog id="dlg"><img id="big" alt="확대"></dialog>
<script>
const LABELS = [["match", "일치", "1"], ["not_visible", "안 보임", "2"], ["different", "다름", "3"]];
const REASON_KO = { text: "글자", count: "개수", shape: "모양", color: "색과 재질", other_product: "다른 제품" };
const REASON_KEY = { text: "q", count: "w", shape: "e", color: "r", other_product: "t" };
const VERDICT_KO = { match: "일치", not_visible: "안 보임", different: "다름", unverified: "확인 필요", no_print: "프린트 없음" };
const TOOL_WHY_KO = { text: "글자", invented_text: "지어낸 글자", count: "개수" };
const ko = (map, v) => v == null ? "-" : (map[v] || v);
const $ = id => document.getElementById(id);
let cases = [], data = null, idx = 0, pick = null, why = new Set(), busy = false;

async function api(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function loadCases(keep) {
  cases = await api("/api/label/cases");
  const sel = $("case");
  sel.innerHTML = cases.map(c => `<option value="${esc(c.case)}">${esc(c.case)}번 ${esc(c.query || "")} (${c.done} / ${c.n})</option>`).join("");
  if (keep) sel.value = keep;
  const d = cases.reduce((a, c) => a + c.done, 0), n = cases.reduce((a, c) => a + c.n, 0);
  $("total").innerHTML = `전체 <b>${d} / ${n}</b>`;
}
async function openCase(case_) {
  data = await api("/api/label/" + case_);
  $("about").textContent = data.about;
  $("refs").innerHTML = data.refs.map(u => `<img src="${u}" alt="실물 사진" loading="lazy">`).join("");
  $("refs").querySelectorAll("img").forEach(im => im.onclick = () => { $("big").src = im.src; $("dlg").showModal(); });
  const first = data.outputs.findIndex(o => !o.label);
  show(first < 0 ? 0 : first);
}
function show(i) {
  if (!data || !data.outputs.length) { $("img").removeAttribute("src"); $("fname").textContent = "결과물이 없습니다"; return; }
  idx = Math.max(0, Math.min(data.outputs.length - 1, i));
  const o = data.outputs[idx];
  pick = o.label; why = new Set(o.why || []);
  $("img").src = o.url; $("fname").textContent = o.file;
  $("state").textContent = o.label ? "라벨 있음" : "라벨 없음";
  $("pos").textContent = `${idx + 1} / ${data.outputs.length}, 라벨 ${data.outputs.filter(x => x.label).length}장`;
  $("tool").textContent = "";
  draw();
}
function draw() {
  $("btns").innerHTML = LABELS.map(([v, ko, k]) => `<button class="btn ${v}${pick === v ? " on" : ""}" data-v="${v}">${ko}(${k})</button>`).join("");
  $("btns").querySelectorAll("button").forEach(b => b.onclick = () => choose(b.dataset.v));
  const diff = pick === "different";
  $("chips").hidden = !diff;
  $("chipList").innerHTML = data.reasons.map(r => `<button class="chip${why.has(r) ? " on" : ""}" data-r="${r}">${REASON_KO[r]}(${REASON_KEY[r].toUpperCase()})</button>`).join("");
  $("chipList").querySelectorAll("button").forEach(b => b.onclick = () => toggle(b.dataset.r));
}
function choose(v) {
  if (busy) return;
  pick = v;
  if (v === "different") draw(); else { why = new Set(); save(); }
}
function toggle(r) { if (pick !== "different") return; why.has(r) ? why.delete(r) : why.add(r); draw(); }
async function save() {
  if (busy || !pick) return;
  if (pick === "different" && !why.size) { $("tool").innerHTML = '<span class="err">이유를 하나 이상 고르세요.</span>'; return; }
  busy = true;
  const o = data.outputs[idx];
  try {
    const r = await api("/api/label/" + data.case, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file: o.file, label: pick, why: [...why] }) });
    o.label = r.label; o.why = r.why; o.tool = r.tool;
    const t = r.tool;
    let note = "방금 저장한 컷, 검수기 결과 없음";
    if (t) {
      note = `방금 저장한 컷, 검수기: 첫 판정 ${ko(VERDICT_KO, t.first)}, 최종 ${ko(VERDICT_KO, t.final)}`;
      if (t.strong) note += `, 강한 검사 ${ko(VERDICT_KO, t.strong)}` + (t.why && t.why.length ? `(${t.why.map(w => ko(TOOL_WHY_KO, w)).join(", ")})` : "");
    }
    const next = data.outputs.findIndex((x, j) => j > idx && !x.label);
    const any = next >= 0 ? next : data.outputs.findIndex(x => !x.label);
    show(any >= 0 ? any : idx);
    if (any < 0) note += "  이 케이스는 끝났습니다.";
    $("tool").textContent = note;
    await loadCases(data.case);
  } catch (e) { $("tool").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  busy = false;
}
$("save").onclick = save;
$("prev").onclick = () => show(idx - 1);
$("next").onclick = () => show(idx + 1);
// Give focus back to the page, so 1 2 3 label the output and the arrow keys do not change the case.
$("case").onchange = e => { e.target.blur(); openCase(e.target.value); };
$("img").onclick = () => { $("big").src = $("img").src; $("dlg").showModal(); };
$("dlg").onclick = () => $("dlg").close();
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !data) return;
  if (e.target.tagName === "SELECT") return;
  if (busy) return;
  const k = e.key.toLowerCase();
  if (k === "1") choose("match");
  else if (k === "2") choose("not_visible");
  else if (k === "3") choose("different");
  else if (k === "enter") { if (pick === "different") { e.preventDefault(); save(); } }
  else if (k === "arrowleft") show(idx - 1);
  else if (k === "arrowright") show(idx + 1);
  else { const r = Object.keys(REASON_KEY).find(x => REASON_KEY[x] === k); if (r) toggle(r); }
});
(async () => {
  try {
    await loadCases();
    if (cases.length) { const c = cases.find(x => x.case === "10") || cases[0]; $("case").value = c.case; await openCase(c.case); }
  } catch (e) { $("tool").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
})();
</script>
</body>
</html>
